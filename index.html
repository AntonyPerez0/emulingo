<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0b0f17" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f6f7fb" media="(prefers-color-scheme: light)">
  <meta name="description" content="Play retro games you own and learn a language as you go. Spritespeak reads the text on screen, translates it and turns it into flashcards.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Spritespeak">
  <title>Spritespeak — learn a language by playing</title>
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">
  <link rel="manifest" href="manifest.webmanifest">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="app-header">
    <div class="app-header__inner">
      <a class="brand" href="#/play">
        <svg class="brand__mark" viewBox="0 0 64 64" width="32" height="32" aria-hidden="true" focusable="false">
          <rect width="64" height="64" rx="14" fill="#0b0f17"/>
          <path d="M22 7h20a6 6 0 0 1 6 6v32a12 12 0 0 1-12 12H22a6 6 0 0 1-6-6V13a6 6 0 0 1 6-6Z" fill="#22c55e"/>
          <rect x="21" y="12" width="22" height="20" rx="3" fill="#0b0f17"/>
          <path d="M27.5 16.5h9a3 3 0 0 1 3 3v3.5a3 3 0 0 1-3 3h-5.2l-3.3 3v-3h-.5a3 3 0 0 1-3-3v-3.5a3 3 0 0 1 3-3Z" fill="#22c55e"/>
          <path d="M23.5 39.5h3v3h3v3h-3v3h-3v-3h-3v-3h3Z" fill="#0b0f17"/>
          <circle cx="37.5" cy="45" r="2.5" fill="#0b0f17"/>
          <circle cx="42" cy="40.5" r="2.5" fill="#0b0f17"/>
        </svg>
        <span class="brand__name">Spritespeak</span>
      </a>

      <nav class="app-nav" aria-label="Primary">
        <ul class="app-nav__list" role="list">
          <li>
            <a class="app-nav__link" href="#/play" data-nav="play">
              <span class="app-nav__icon" data-icon="gamepad"></span>
              <span class="app-nav__label">Play</span>
            </a>
          </li>
          <li>
            <a class="app-nav__link" href="#/review" data-nav="review">
              <span class="app-nav__icon" data-icon="graduation-cap"></span>
              <span class="app-nav__label">Review</span>
              <span class="nav-badge" data-badge="review" aria-hidden="true" hidden></span>
              <span class="visually-hidden" data-badge-label="review"></span>
            </a>
          </li>
          <li>
            <a class="app-nav__link" href="#/dictionary" data-nav="dictionary">
              <span class="app-nav__icon" data-icon="book-open"></span>
              <span class="app-nav__label">Dictionary</span>
            </a>
          </li>
          <li>
            <a class="app-nav__link" href="#/deck" data-nav="deck">
              <span class="app-nav__icon" data-icon="layers"></span>
              <span class="app-nav__label">Deck</span>
            </a>
          </li>
          <li>
            <a class="app-nav__link" href="#/settings" data-nav="settings">
              <span class="app-nav__icon" data-icon="settings"></span>
              <span class="app-nav__label">Settings</span>
            </a>
          </li>
        </ul>
      </nav>

      <div class="app-header__actions">
        <button type="button" class="lang-chip" id="lang-chip" aria-haspopup="dialog">
          <span class="lang-chip__pair">Languages</span>
        </button>
      </div>
    </div>
  </header>

  <main id="main" tabindex="-1">
    <div class="boot" id="boot">
      <span class="spinner-wrap" role="status"><span class="spinner spinner--lg" aria-hidden="true"></span><span>Loading Spritespeak…</span></span>
      <p class="boot__late">This is taking longer than usual. <a href="./">Reload the page</a> if nothing happens.</p>
    </div>
    <section data-view="play" hidden></section>
    <section data-view="review" hidden></section>
    <section data-view="dictionary" hidden></section>
    <section data-view="deck" hidden></section>
    <section data-view="settings" hidden></section>
  </main>

  <section class="toast-region" id="toast-region" aria-label="Notifications"></section>
  <div id="sr-status" class="visually-hidden" role="status" aria-live="polite" aria-atomic="true"></div>
  <div id="sr-alert" class="visually-hidden" role="alert" aria-live="assertive" aria-atomic="true"></div>

  <noscript>
    <div class="noscript">
      <h1>JavaScript is turned off</h1>
      <p>Spritespeak runs entirely in your browser and needs JavaScript to play games and translate them. Turn it on, then reload this page.</p>
    </div>
  </noscript>

  <script type="module" src="src/main.js"></script>
</body>
</html>
