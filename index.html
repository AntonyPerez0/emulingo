<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#16a34a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Emulingo" />
  <title>Emulingo - Learn a language by playing</title>
  <meta name="description" content="Play Game Boy games you legally own and learn a language: live OCR translation, text-to-speech and spaced-repetition flashcards." />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="src/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="icons/icon-192.png" alt="" class="logo" />
      <span class="brand-name">Emulingo</span>
    </div>
    <nav class="tabs" id="tab-nav">
      <button class="tab active" data-tab="play">Play</button>
      <button class="tab" data-tab="review">Review</button>
      <button class="tab" data-tab="dictionary">Dictionary</button>
      <button class="tab" data-tab="deck">Deck</button>
      <button class="tab" data-tab="settings">Settings</button>
    </nav>
    <div class="status" id="header-status"></div>
  </header>

  <main id="main">
    <section id="tab-play" class="tab-page active"></section>
    <section id="tab-review" class="tab-page"></section>
    <section id="tab-dictionary" class="tab-page"></section>
    <section id="tab-deck" class="tab-page"></section>
    <section id="tab-settings" class="tab-page"></section>
  </main>

  <div id="toast-wrap"></div>

  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
